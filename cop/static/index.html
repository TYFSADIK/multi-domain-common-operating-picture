<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Common Operating Picture</title>
<style>
  :root{--bg:#0f1418;--panel:#182027;--fg:#e6edf3;--muted:#8b98a5;--air:#5ab0ff;--water:#3fd0c9;--ground:#e3b341;--alert:#ff6b6b}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:grid;grid-template-columns:1fr 320px;height:100vh}
  @media(max-width:800px){body{grid-template-columns:1fr;grid-template-rows:60vh auto}}
  canvas{width:100%;height:100%;display:block}
  aside{background:var(--panel);padding:12px 16px;overflow:auto}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px}
  .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #243039}
  .alert{color:var(--alert)}
</style></head>
<body>
<canvas id="map"></canvas>
<aside>
  <h2>Tracks</h2><div id="tracks"></div>
  <h2>Alerts (human review)</h2><div id="alerts"></div>
  <h2>Rejected messages</h2><div id="rej">0</div>
</aside>
<script>
const cv=document.getElementById('map'),cx=cv.getContext('2d');
const col={air:getComputedStyle(document.documentElement).getPropertyValue('--air'),
           water:getComputedStyle(document.documentElement).getPropertyValue('--water'),
           ground:getComputedStyle(document.documentElement).getPropertyValue('--ground')};
function draw(s){
  cv.width=cv.clientWidth;cv.height=cv.clientHeight;const W=cv.width,H=cv.height,sc=Math.min(W,H)/2000;
  cx.strokeStyle='#243039';for(let r=250;r<=1000;r+=250){cx.beginPath();cx.arc(W/2,H/2,r*sc,0,7);cx.stroke();}
  for(const t of s.tracks){const x=W/2+t.e*sc,y=H/2-t.n*sc;cx.fillStyle=col[t.domain]||'#fff';
    cx.beginPath();cx.arc(x,y,5,0,7);cx.fill();cx.strokeStyle=cx.fillStyle;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+t.ve*20*sc,y-t.vn*20*sc);cx.stroke();
    cx.fillText(`#${t.id} ${t.kind}`,x+8,y-8);}
  document.getElementById('tracks').innerHTML=s.tracks.map(t=>`<div class=row><span>#${t.id} ${t.kind}</span><span>${t.domain} · ±${t.sigma_m} m</span></div>`).join('');
  document.getElementById('alerts').innerHTML=s.alerts.slice(-10).reverse().map(a=>`<div class="row alert"><span>${a.type}</span><span>${a.node}</span></div>`).join('');
  document.getElementById('rej').textContent=s.rejected;
}
new EventSource('/events').onmessage=e=>draw(JSON.parse(e.data));
</script></body></html>
